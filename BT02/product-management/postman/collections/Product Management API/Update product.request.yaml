$kind: http-request
method: PUT
url: '{{base_url}}/api/products/{{product_id}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: product_id
    value: '1'
body:
  type: json
  content: |-
    {
      "name": "Laptop Dell XPS 15",
      "price": 1800.0
    }
